name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  test-and-build:
    name: JVM tests + Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-licenses: true

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Run JVM unit tests (testDebugUnitTest)
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-results-testDebugUnitTest
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build reports (on failure)
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize test results
        if: ${{ always() }}
        uses: dorny/test-reporter@v1
        with:
          name: JVM unit tests
          path: app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-error: false
          max-annotations: 20

      - name: Fail if tests failed
        if: ${{ failure() }}
        run: |
          echo "Tests or build failed. See uploaded artifacts and the test report above."
          exit 1
