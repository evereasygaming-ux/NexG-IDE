# NexG IDE — mandatory memory configuration (PLAN.MD 7.2)
#
# Measured on this device: RAM 5.4 GiB total, ~1.3-1.6 GiB available,
# 3.8 GiB swap free. A default Gradle + Kotlin daemon pair wants ~2.5 GiB,
# which would swap heavily or OOM. Do NOT raise these values.
#
# org.gradle.workers.max=1 and kotlin.compiler.execution.strategy=in-process
# are the two settings that keep this inside the available envelope:
#   - workers.max=1          -> no parallel workers competing for RAM
#   - in-process             -> removes the second Kotlin daemon JVM (~800 MiB)

org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
